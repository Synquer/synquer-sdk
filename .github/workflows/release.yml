name: Release

# Triggered when a version tag is pushed to main, e.g. `v0.1.0`.
# The job parses the version from the tag, ensures it matches package.json,
# builds, and publishes to npm. Pre-release tags (e.g. `v0.1.0-beta.1`) are
# published under the `next` dist-tag instead of `latest`.
#
# Setup:
#   1. Create an automation token at https://www.npmjs.com/settings/<user>/tokens
#      (type: "Automation"; granular if possible, scoped to synquer-sdk).
#   2. Add it to the repo as a secret named NPM_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
#   3. Push a tag: `git tag v0.1.0 && git push origin v0.1.0`

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for softprops/action-gh-release to create the GitHub release
      id-token: write  # needed for npm publish --provenance
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (npm tag: $NPM_TAG)"

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.parse.outputs.version }}" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag (${{ steps.parse.outputs.version }})"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:run -- --exclude tests/integration.test.ts

      - name: Build
        run: npm run build

      - name: Check if version already on npm
        id: npm_check
        run: |
          if npm view synquer-sdk@${{ steps.parse.outputs.version }} version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "synquer-sdk@${{ steps.parse.outputs.version }} already on npm — skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm_check.outputs.already_published == 'false'
        run: npm publish --access public --tag ${{ steps.parse.outputs.npm_tag }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
